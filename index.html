<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0A0810;--bg2:#100D1A;--bg3:#181324;--bg4:#221B33;--bg5:#2E2445;
  --p100:#DDD5FF;--p200:#C4B5FD;--p300:#A78BFA;--p400:#8B5CF6;--p500:#7C3AED;
  --acc:#A78BFA;--acc2:#C4B5FD;--acc3:#7C3AED;
  --text:#F2EEFF;--text2:#9C8FC0;--text3:#564E70;
  --green:#34D399;--red:#F87171;--card-h:470px;--r:26px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
.phone{max-width:390px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;}
.phone::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;font-size:11px;color:var(--text3);font-weight:500;}
.topbar{padding:8px 22px 14px;display:flex;align-items:center;justify-content:space-between;}
.wordmark{font-size:20px;font-weight:800;letter-spacing:-0.8px;}
.wordmark em{color:var(--acc);font-style:normal;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.icon-btn{width:38px;height:38px;border-radius:14px;background:var(--bg3);border:1px solid var(--bg5);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;}
.notif-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;background:var(--acc);border-radius:50%;border:2px solid var(--bg);}
.avatar{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--p500),var(--p300));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;}
.location-row{padding:0 22px 14px;display:flex;align-items:center;}
.loc-pill{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--bg5);border-radius:100px;padding:7px 14px;font-size:13px;color:var(--text2);}
.loc-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);}
.cats-label{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:0 22px 10px;}
.cats-scroll{display:flex;gap:8px;padding:0 22px 18px;overflow-x:auto;scrollbar-width:none;}
.cats-scroll::-webkit-scrollbar{display:none;}
.cat-pill{flex-shrink:0;padding:7px 15px;border-radius:100px;border:1px solid var(--bg5);background:var(--bg2);font-size:13px;font-weight:400;color:var(--text2);cursor:pointer;transition:all .18s;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.cat-pill.on{background:var(--p500);border-color:var(--p500);color:#fff;font-weight:600;box-shadow:0 4px 20px rgba(124,58,237,.4);}
.stack-wrap{flex:1;position:relative;padding:0 18px;display:flex;align-items:flex-start;justify-content:center;}
.stack{position:relative;width:100%;height:var(--card-h);}
.place-card{position:absolute;width:100%;height:var(--card-h);border-radius:var(--r);overflow:hidden;cursor:grab;border:1px solid rgba(255,255,255,.06);transform-origin:50% 115%;will-change:transform;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.place-card:active{cursor:grabbing;}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .3s;}
.card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,16,0) 0%,rgba(10,8,16,.05) 35%,rgba(10,8,16,.7) 62%,rgba(10,8,16,.97) 100%);}
/* fallback gradients por categoria */
.bg-rooftop{background:linear-gradient(160deg,#1a0f35 0%,#2d1a5c 40%,#5b2d8c 75%,#8b5cf6 100%);}
.bg-cafe{background:linear-gradient(160deg,#180e30 0%,#2a1850 40%,#4a2878 75%,#7c3aed 100%);}
.bg-bar{background:linear-gradient(160deg,#0f0d25 0%,#1e1845 40%,#352d7a 75%,#6d5af0 100%);}
.bg-balada{background:linear-gradient(160deg,#1a0830 0%,#340e5e 40%,#6b1fa0 75%,#a855f7 100%);}
.bg-romantico{background:linear-gradient(160deg,#1a0d2e 0%,#2f1555 40%,#5c2894 75%,#9333ea 100%);}
.bg-barato{background:linear-gradient(160deg,#0d1030 0%,#181d52 40%,#2d3890 75%,#6366f1 100%);}
.bg-alta{background:linear-gradient(160deg,#150e28 0%,#261848 40%,#4a2e82 75%,#7c3aed 100%);}
.bg-vegano{background:linear-gradient(160deg,#0e1820 0%,#162d3c 40%,#1d5060 75%,#2dd4bf 100%);}
.bg-pet{background:linear-gradient(160deg,#180f2e 0%,#2e1852 40%,#5a2e96 75%,#a78bfa 100%);}
.bg-insta{background:linear-gradient(160deg,#1a0a28 0%,#380f52 40%,#6e1f8a 75%,#c026d3 100%);}
.card-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 20%,rgba(167,139,250,.15) 0%,transparent 60%);}
.card-emoji-bg{position:absolute;right:-10px;top:40px;font-size:120px;opacity:.12;filter:blur(2px);pointer-events:none;line-height:1;}
.card-top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;}
.cat-tag{background:rgba(167,139,250,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(167,139,250,.3);color:var(--p100);font-size:11px;font-weight:600;padding:5px 12px;border-radius:100px;letter-spacing:.5px;text-transform:uppercase;}
.price-tag{background:rgba(0,0,0,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);color:var(--acc2);font-size:13px;font-weight:700;padding:5px 12px;border-radius:100px;}
.card-bottom{position:absolute;bottom:0;left:0;right:0;padding:22px 22px 20px;}
.card-name{font-size:26px;font-weight:800;color:#fff;line-height:1.05;margin-bottom:4px;letter-spacing:-0.8px;}
.card-addr{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:6px;}
.card-meta{font-size:13px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.meta-sep{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.ig-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:100px;padding:6px 12px;font-size:12px;color:rgba(255,255,255,.7);font-weight:500;}
.stamp{position:absolute;top:28px;padding:8px 18px;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:0;pointer-events:none;backdrop-filter:blur(8px);}
.stamp-like{left:22px;background:rgba(52,211,153,.12);border:2.5px solid var(--green);color:var(--green);transform:rotate(-14deg);}
.stamp-nope{right:22px;background:rgba(248,113,113,.12);border:2.5px solid var(--red);color:var(--red);transform:rotate(14deg);}
.progress-row{display:flex;justify-content:center;gap:5px;padding:10px 0 4px;}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--bg5);transition:all .2s;}
.pdot.on{background:var(--acc);width:18px;border-radius:3px;}
.btns{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 24px 12px;}
.abtn{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:none;border:none;}
.abtn .c{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid;transition:transform .12s,background .15s;}
.abtn:active .c{transform:scale(.91);}
.abtn .lbl{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;}
.b-pass .c{border-color:var(--bg5);background:var(--bg2);color:var(--text3);}
.b-pass .lbl{color:var(--text3);}
.b-save .c{border-color:var(--p300);background:rgba(167,139,250,.08);color:var(--p300);}
.b-save .lbl{color:var(--p300);}
.b-like .c{border-color:var(--green);background:rgba(52,211,153,.08);color:var(--green);}
.b-like .lbl{color:var(--green);}
.b-pass:hover .c{background:var(--bg3);}
.b-like:hover .c{background:rgba(52,211,153,.14);}
.b-save:hover .c{background:rgba(167,139,250,.14);}

.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 4px;border-radius:16px;transition:background .15s;background:none;border:none;}
.ni.on{background:var(--bg3);}
.ni-icon{font-size:19px;line-height:1;}
.ni-lbl{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);}
.ni.on .ni-lbl{color:var(--acc);}
.nbadge{background:var(--p500);color:#fff;font-size:9px;font-weight:700;border-radius:100px;padding:1px 6px;}
.saved-view{display:none;flex:1;flex-direction:column;overflow-y:auto;}
.saved-header{padding:4px 22px 14px;}
.saved-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.saved-sub{font-size:13px;color:var(--text2);margin-top:2px;}
.saved-grid{display:flex;flex-direction:column;gap:8px;padding:0 18px 8px;}
.saved-row{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:12px 14px;cursor:pointer;transition:background .15s;}
.saved-row:hover{background:var(--bg3);}
.saved-thumb{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background-size:cover;background-position:center;}
.saved-name{font-size:15px;font-weight:700;letter-spacing:-.3px;}
.saved-meta{font-size:12px;color:var(--text2);margin-top:2px;}
.saved-price{margin-left:auto;font-size:13px;font-weight:700;color:var(--acc);}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 40px;}
.empty-ico{width:72px;height:72px;border-radius:24px;background:var(--bg3);border:1px solid var(--bg5);display:flex;align-items:center;justify-content:center;font-size:32px;}
.empty-title{font-size:17px;font-weight:700;}
.empty-sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.6;}
.photo-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;opacity:.3;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.su{animation:slideUp .32s cubic-bezier(.22,1,.36,1) both;}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, deleteDoc, getDocs, collection }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCz1Ti_twBmtDxGOc9cGiXHBNbFTOdvYAg",
    authDomain: "ondeircuritiba-91390.firebaseapp.com",
    projectId: "ondeircuritiba-91390",
    storageBucket: "ondeircuritiba-91390.firebasestorage.app",
    messagingSenderId: "208330257440",
    appId: "1:208330257440:web:6df311fc5c60c389117845",
    measurementId: "G-05C4VFDWMK"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  let userId = localStorage.getItem('cwb_uid');
  if (!userId) { userId = crypto.randomUUID(); localStorage.setItem('cwb_uid', userId); }

  window.fsSave = async (place) => {
    try { await setDoc(doc(db, 'favorites', userId, 'places', place.id), place); }
    catch(e) { console.warn('fsSave:', e); }
  };

  window.fsRemove = async (placeId) => {
    try { await deleteDoc(doc(db, 'favorites', userId, 'places', placeId)); }
    catch(e) { console.warn('fsRemove:', e); }
  };

  window.fsLoadAll = async () => {
    try {
      const snap = await getDocs(collection(db, 'favorites', userId, 'places'));
      return snap.docs.map(d => d.data());
    } catch(e) { console.warn('fsLoadAll:', e); return []; }
  };
</script>

// ─── Google Places API Key ─────────────────────────────────────────
const GOOGLE_API_KEY = 'AIzaSyDiLhxU3veHWvx3fvA6kk6TluFFHYWHEzs';

// ─── Cache de fotos (sessionStorage) ──────────────────────────────
const photoCache = {};

async function fetchPlacePhoto(placeId, bgClass) {
  if (!placeId || placeId.startsWith('ID_GOOGLE_')) return null;
  if (photoCache[placeId]) return photoCache[placeId];

  try {
    const url = `https://places.googleapis.com/v1/places/${placeId}?fields=photos&key=${GOOGLE_API_KEY}`;
    const res = await fetch(url, {
      headers: { 'X-Goog-FieldMask': 'photos' }
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.photos || !data.photos.length) return null;

    const photoRef = data.photos[0].name;
    const photoUrl = `https://places.googleapis.com/v1/${photoRef}/media?maxHeightPx=800&maxWidthPx=600&key=${GOOGLE_API_KEY}`;
    photoCache[placeId] = photoUrl;
    return photoUrl;
  } catch(e) {
    return null;
  }
}

const CE   = {"Todos":"🗺️","Café da tarde":"☕","Barzinho":"🍸","Céu aberto":"🌆","Balada":"🎵","Romântico":"🕯️","Baratinho":"🍔","Alta gastronomia":"⭐","Vegano":"🌱","Pet friendly":"🐾","Instagramável":"📸"};

let cat="Todos", filtered=[...P], idx=0, saved=[], ratings={};
let drag=false, sx=0, cx=0;

// ─── Init ──────────────────────────────────────────────────────────
function init(){
  const row = document.getElementById('catsRow');
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat-pill' + (c === cat ? ' on' : '');
    b.innerHTML = `<span style="font-size:13px">${CE[c]||''}</span>${c}`;
    b.onclick = () => setCat(c);
    row.appendChild(b);
  });
  renderCard();
  renderProgress();

  // Carrega favoritos do Firestore
  if (typeof window.fsLoadAll === 'function') {
    window.fsLoadAll().then(places => {
      if (places && places.length) {
        saved = places;
        const b = document.getElementById('nbadge');
        b.style.display = 'inline';
        b.textContent = saved.length;
      }
    });
  }
}

function setCat(c){
  cat = c;
  document.querySelectorAll('.cat-pill').forEach((b,i) => b.classList.toggle('on', CATS[i] === c));
  filtered = c === 'Todos' ? [...P] : P.filter(p => p.c === c);
  idx = 0;
  renderCard();
  renderProgress();
}

function place(){ return filtered[idx % filtered.length]; }

function renderProgress(){
  const row   = document.getElementById('progressRow');
  const total = Math.min(filtered.length, 5);
  row.innerHTML = '';
  for(let i = 0; i < total; i++){
    const d = document.createElement('div');
    d.className = 'pdot' + (i === idx % total ? ' on' : '');
    row.appendChild(d);
  }
}

// ─── Renderiza cards ───────────────────────────────────────────────
function renderCard(){
  const stack = document.getElementById('cardStack');
  stack.querySelectorAll('.place-card').forEach(e => e.remove());
  if(!filtered.length) return;

  for(let i = Math.min(2, filtered.length - 1); i >= 0; i--){
    const p    = filtered[(idx + i) % filtered.length];
    const card = makeCard(p);
    if(i > 0){
      card.style.transform    = `translateY(${i*10}px) scale(${1 - i*0.04})`;
      card.style.zIndex       = 10 - i;
      card.style.opacity      = 1 - i * 0.2;
      card.style.pointerEvents = 'none';
    } else {
      card.style.zIndex = 20;
      bindDrag(card);
    }
    stack.appendChild(card);
  }

  // Busca foto do card do topo de forma assíncrona
  const top = filtered[idx % filtered.length];
  if(top.pid && !top.pid.startsWith('ID_GOOGLE_')){
    fetchPlacePhoto(top.pid, top.bg).then(url => {
      if(!url) return;
      const bg = stack.querySelector('.place-card[style*="z-index: 20"] .card-bg');
      if(bg){
        bg.style.backgroundImage = `url("${url}")`;
        bg.style.backgroundSize  = 'cover';
      }
    });
  }
}

function makeCard(p){
  const el   = document.createElement('div');
  el.className = 'place-card su';
  el.innerHTML = `
    <div class="card-bg bg-${p.bg}">
      <div class="photo-loading">${p.e}</div>
    </div>
    <div class="card-overlay"></div>
    <div class="card-glow"></div>
    <div class="card-top">
      <div class="cat-tag">${p.c}</div>
      <div class="price-tag">${p.p}</div>
    </div>
    <div class="card-bottom">
      <div class="card-name">${p.n}</div>
      <div class="card-addr">📍 ${p.a}</div>
      <div class="card-meta">
        <span>${p.b}</span>
        <div class="meta-sep"></div>
        <span>🕐 ${p.h}</span>
      </div>
      <div class="card-footer">
        <div class="ig-chip"><span style="font-size:12px">📷</span>${p.ig}</div>
      </div>
    </div>`;
  return el;
}

// ─── Drag ──────────────────────────────────────────────────────────
function bindDrag(card){
  const onStart = e => { drag=true; sx=(e.touches?e.touches[0].clientX:e.clientX); cx=0; card.style.transition='none'; };
  const onMove  = e => {
    if(!drag) return;
    cx = (e.touches?e.touches[0].clientX:e.clientX) - sx;
    const rot = cx * .065, ty = Math.abs(cx) * .04;
    card.style.transform = `translateX(${cx}px) rotate(${rot}deg) translateY(${ty}px)`;
    const ls = document.getElementById('likeStamp'), ns = document.getElementById('nopeStamp');
    const t  = Math.abs(cx) > 50 ? Math.min((Math.abs(cx)-50)/80, 1) : 0;
    if(cx > 50)       { ls.style.opacity=t; ns.style.opacity=0; }
    else if(cx < -50) { ns.style.opacity=t; ls.style.opacity=0; }
    else              { ls.style.opacity=0; ns.style.opacity=0; }
  };
  const onEnd = () => {
    if(!drag) return; drag=false;
    document.getElementById('likeStamp').style.opacity=0;
    document.getElementById('nopeStamp').style.opacity=0;
    if(Math.abs(cx) > 110){ cx > 0 ? swipe('right') : swipe('left'); }
    else { card.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)'; card.style.transform=''; }
    cx = 0;
  };
  card.addEventListener('mousedown', onStart);
  card.addEventListener('touchstart', onStart, {passive:true});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

// ─── Swipe / Save ──────────────────────────────────────────────────
function swipe(dir){
  const card = document.querySelector('.place-card[style*="z-index: 20"]');
  if(!card) return;
  const p = place();
  card.style.transition = 'transform .4s cubic-bezier(.25,.46,.45,.94),opacity .35s';
  card.style.transform  = dir==='right' ? 'translateX(650px) rotate(24deg)' : 'translateX(-650px) rotate(-24deg)';
  card.style.opacity    = '0';
  if(dir === 'right') doSave(p);
  setTimeout(() => { idx = (idx+1) % filtered.length; renderCard(); renderProgress(); }, 370);
}

function savePlace(){ doSave(place()); swipe('right'); }

function doSave(p){
  if(!saved.find(s => s.id === p.id)){
    saved.push(p);
    const b = document.getElementById('nbadge');
    b.style.display = 'inline';
    b.textContent   = saved.length;
    if(typeof window.fsSave === 'function') window.fsSave(p);
  }
}

// ─── Aba Salvos ───────────────────────────────────────────────────
function renderSaved(){
  const g   = document.getElementById('savedGrid');
  const e   = document.getElementById('emptyMsg');
  const sub = document.getElementById('savedSubtitle');
  g.innerHTML = '';
  if(!saved.length){ e.style.display='flex'; sub.textContent='Nenhum lugar ainda'; return; }
  e.style.display = 'none';
  sub.textContent = `${saved.length} lugar${saved.length>1?'es':''} salvo${saved.length>1?'s':''}`;
  saved.forEach(p => {
    const row = document.createElement('div');
    row.className = 'saved-row su';
    const thumb = `<div class="saved-thumb bg-${p.bg}" id="thumb-${p.id}">${p.e}</div>`;
    row.innerHTML = `${thumb}
      <div>
        <div class="saved-name">${p.n}</div>
        <div class="saved-meta">${p.c} · ${p.b} · ${p.h}</div>
      </div>
      <div class="saved-price">${p.p}</div>`;
    g.appendChild(row);

    // Foto no thumbnail
    if(p.pid && !p.pid.startsWith('ID_GOOGLE_')){
      fetchPlacePhoto(p.pid, p.bg).then(url => {
        if(!url) return;
        const t = document.getElementById(`thumb-${p.id}`);
        if(t){ t.style.backgroundImage=`url("${url}")`; t.textContent=''; }
      });
    }
  });
}

function showTab(t){
  const disc = document.getElementById('discoverView');
  const sv   = document.getElementById('savedView');
  ['navDiscover','navSaved','navMap'].forEach(id => document.getElementById(id)?.classList.remove('on'));
  document.getElementById(t==='discover'?'navDiscover':t==='saved'?'navSaved':'navMap')?.classList.add('on');
  disc.style.display = t==='discover' ? 'flex' : 'none';
  sv.style.display   = t==='saved'    ? 'flex' : 'none';
  if(t === 'saved') renderSaved();
}

init();
</script>
