<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Day Match</title>

<!-- Favicon / ícones -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B09" media="(prefers-color-scheme: dark)">

<!-- Theme aplicado antes do render para evitar flash -->
<script>
(function(){
  var t=localStorage.getItem('cwb_theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800;12..96,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="phone">

  <!-- ── Tela de boas-vindas ── -->
  <div id="welcomeScreen" style="display:none;position:absolute;inset:0;z-index:200;background:var(--bg);flex-direction:column;overflow:hidden;">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(20,20,15,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(20,20,15,.04) 0%,transparent 50%);pointer-events:none;"></div>
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:48px 26px 20px;position:relative;">
      <div id="welcomeGreeting" style="font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px">Boa tarde</div>
      <div style="font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-0.8px;color:var(--text);margin-bottom:6px">O que você<br>quer fazer hoje?</div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:18px">Escolha uma categoria para começar seu rolê de hoje em Curitiba</div>
      <div id="welcomeCats" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px 8px"></div>
    </div>
    <div style="padding:16px 26px 32px;display:flex;flex-direction:column;gap:10px;">
      <button onclick="window.closeWelcome(null)" style="width:100%;padding:16px;border-radius:18px;background:var(--acc);border:none;color:var(--acc-ink);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-card);">
        Explorar tudo
      </button>
      <button onclick="window.closeWelcome(null)" style="background:none;border:none;color:var(--text3);font-family:inherit;font-size:13px;cursor:pointer;padding:4px;">
        Pular
      </button>
    </div>
  </div>

  <!-- ── Top bar ── -->
  <div class="topbar">
    <div class="wordmark">Day<em>Match</em><small>Curitiba</small></div>
    <div class="topbar-right">
      <button class="theme-btn" id="searchBtn" onclick="window.openSearchOverlay()" title="Buscar lugar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Alternar tema"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <div class="avatar" id="topAvatar" onclick="handleAvatarClick()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
    </div>
  </div>

  <!-- ── Category pills ── -->
  <div class="cats-header">
    <div class="cats-label">Categoria</div>
    <div class="cats-pills">
      <button class="open-now-pill" id="planBtn" onclick="window.openPlanSheet()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> <span id="planBtnLabel">Aberto em…</span></button>
      <button class="open-now-pill" id="openNowBtn" onclick="toggleOpenNow()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Abertos agora</button>
    </div>
  </div>
  <div class="cats-scroll" id="catsRow"></div>

  <!-- ── Discover view ── -->
  <div id="discoverView" style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div class="stack-wrap">
      <div class="stack" id="cardStack">
        <div class="stamp stamp-like" id="likeStamp">Quero ir!</div>
        <div class="stamp stamp-nope" id="nopeStamp">Não hoje</div>
        <div class="stamp stamp-save" id="saveStamp"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Salvo</div>
        <div class="stamp stamp-been" id="beenStamp"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Já fui</div>
      </div>
    </div>
    <div class="btns">
      <button class="abtn b-undo" id="undoBtn" onclick="undoSwipe()" title="Desfazer último swipe">
        <div class="c"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></div>
        <div class="lbl">Desfazer</div>
      </button>
      <button class="abtn b-pass" onclick="swipe('left',true)">
        <div class="c"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
        <div class="lbl">Não hoje</div>
      </button>
      <button class="abtn b-like" onclick="swipe('right',true)">
        <div class="c"><svg width="26" height="26" fill="currentColor" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
        <div class="lbl">Quero ir!</div>
      </button>
      <button class="abtn b-save" onclick="savePlace()">
        <div class="c"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></div>
        <div class="lbl">Salvar</div>
      </button>
    </div>
  </div>

  <!-- ── Want Today view ── -->
  <div class="favorites-view" id="wantTodayView" style="display:none;flex-direction:column;flex:1;min-height:0;overflow-y:auto;"></div>

  <!-- ── Favorites view ── -->
  <div class="favorites-view" id="favoritesView" style="display:none;">
    <div class="fav-header">
      <div>
        <div class="fav-title">Salvos</div>
        <div class="fav-subtitle" id="favSubtitle">Nenhum lugar salvo</div>
      </div>
      <button class="fav-toggle" id="favToggle" style="display:none" onclick="onFavToggle()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Ver no mapa
      </button>
    </div>
    <div class="fav-filter-row" id="favFilterRow">
      <button class="fav-filter on" data-filter="all"    onclick="setFavFilter('all')">Todos</button>
      <button class="fav-filter"     data-filter="been"   onclick="setFavFilter('been')">Já fui</button>
      <button class="fav-filter"     data-filter="rated"  onclick="setFavFilter('rated')">Avaliados</button>
    </div>
    <div class="empty" id="favEmpty">
      <div class="empty-ico"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
      <div class="empty-title">Lista vazia</div>
      <div class="empty-sub">Use o <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Salvar nos cards para<br>guardar lugares aqui.</div>
    </div>
    <div class="fav-grid" id="favGrid" style="display:none"></div>
    <div id="favMap"></div>
  </div>

  <!-- ── Map view ── -->
  <div class="favorites-view" id="mapView" style="display:none;flex-direction:column;flex:1;min-height:0;"></div>

  <!-- ── Bottom nav ── -->
  <nav class="nav">
    <button class="ni" id="navWant" onclick="showTab('want')">
      <span class="ni-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg></span>
      <span class="ni-lbl">Quero ir <span class="nbadge" id="wantBadge" style="display:none">0</span></span>
    </button>
    <button class="ni" id="navMap" onclick="showTab('map')">
      <span class="ni-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/></svg></span>
      <span class="ni-lbl">Mapa</span>
    </button>
    <button class="ni ni-discover-center on" id="navDiscover2" onclick="showTab('discover')">
      <span class="ni-center-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></span>
      <span class="ni-lbl">Descobrir</span>
    </button>
    <button class="ni" id="navFavorites" onclick="showTab('favorites')">
      <span class="ni-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></span>
      <span class="ni-lbl">Salvos <span class="nbadge" id="nbadge" style="display:none">0</span></span>
    </button>
    <button class="ni" id="navQuiz" onclick="window.openQuizOverlay()">
      <span class="ni-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 4.8L18 9l-4.1 1.2L12 15l-1.9-4.8L6 9l4.1-1.2z"/><path d="M18 14.5 18.8 17l2.2.8-2.2.8-.8 2.4-.8-2.4-2.2-.8 2.2-.8z"/></svg></span>
      <span class="ni-lbl">Escolher</span>
    </button>
  </nav>

</div><!-- .phone -->

<!-- ── Profile Screen ── -->
<div class="profile-screen" id="profileScreen" style="display:none;">
  <div class="profile-photo-wrap" id="profilePhotoWrap">
    <div class="profile-photo-img"      id="profilePhotoImg"></div>
    <div class="profile-photo-fallback" id="profilePhotoFallback"></div>
    <div class="story-bars" id="storyBars"></div>
    <div class="story-tap story-tap-left"  id="storyTapLeft"></div>
    <div class="story-tap story-tap-right" id="storyTapRight"></div>
    <button class="profile-close" id="profileClose">
      <svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="profile-photo-overlay"></div>
  </div>
  <div class="profile-body" id="profileBody">
    <div class="profile-name"    id="profileName"></div>
    <div class="profile-cat-row">
      <div class="profile-cat-badge" id="profileCat"></div>
      <div class="profile-price"     id="profilePrice"></div>
    </div>
    <div class="profile-info-grid" id="profileInfoGrid"></div>
    <a class="ig-btn" id="profileIgBtn" target="_blank" rel="noopener">

      <span id="profileIgHandle"></span>
    </a>
    <!-- Comentários injetados por comments.js -->
  </div>
</div>

<!-- ── City Selector Sheet ── -->
<div class="city-sheet-backdrop" id="citySheetBackdrop" style="display:none;" onclick="closeCitySheet(event)">
  <div class="city-sheet">
    <div class="city-sheet-handle"></div>
    <div class="city-sheet-title">Escolha a cidade</div>
    <button class="city-option active" id="city-cwb" onclick="selectCity('Curitiba, PR','city-cwb')">
      <div class="city-option-dot"></div> Curitiba
    </button>
    <button class="city-option" id="city-sjp" onclick="selectCity('São José dos Pinhais, PR','city-sjp')">
      <div class="city-option-dot"></div> São José dos Pinhais
    </button>
    <button class="city-option" id="city-pin" onclick="selectCity('Pinhais, PR','city-pin')">
      <div class="city-option-dot"></div> Pinhais
    </button>
  </div>
</div>

<!-- ── Address Action Sheet ── -->
<div class="addr-sheet-backdrop" id="addrSheetBackdrop" style="display:none;" onclick="closeAddrSheet(event)">
  <div class="addr-sheet">
    <div class="addr-sheet-handle"></div>
    <div class="addr-sheet-title" id="addrSheetTitle"></div>
    <button class="addr-sheet-btn" id="addrBtnMaps"><span class="addr-sheet-btn-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></span> Abrir no Google Maps</button>
    <button class="addr-sheet-btn" id="addrBtnCopy"><span class="addr-sheet-btn-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span> Copiar endereço</button>
    <button class="addr-sheet-btn" onclick="closeAddrSheet()">Cancelar</button>
  </div>
</div>

<!-- ── Watchdog de inicialização ──────────────────────────────────
     Se a cadeia de módulos não carregar (SDK do Firebase bloqueado por
     navegador embutido do Instagram/Facebook, rede ou extensão), o app
     não inicia e a tela fica vazia. Aqui detectamos isso e mostramos um
     aviso claro em vez de deixar o usuário sem retorno. -->
<script>
(function(){
  function showBootError(){
    if (window.__dmBooted || document.getElementById('dmBootError')) return;
    var box = document.createElement('div');
    box.id = 'dmBootError';
    box.setAttribute('style',
      'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;'+
      'align-items:center;justify-content:center;gap:14px;text-align:center;'+
      'padding:32px;background:#faf9f6;color:#14140f;font-family:system-ui,-apple-system,sans-serif;');
    box.innerHTML =
      '<div style="font-size:44px;line-height:1">📡</div>'+
      '<div style="font-size:19px;font-weight:800">Não conseguimos carregar o app</div>'+
      '<div style="font-size:14px;max-width:300px;line-height:1.5;color:#555">'+
        'Isso costuma acontecer no navegador de dentro do Instagram/Facebook ou '+
        'com conexão instável. Toque em <b>“Abrir no navegador”</b> (menu ⋯ no canto) '+
        'ou tente recarregar.</div>'+
      '<button id="dmBootReload" style="margin-top:6px;padding:13px 26px;border:none;'+
        'border-radius:14px;background:#14140f;color:#fff;font-size:15px;font-weight:700;'+
        'cursor:pointer">Recarregar</button>';
    document.body.appendChild(box);
    document.getElementById('dmBootReload').onclick = function(){ location.reload(); };
  }
  // Falha explícita de carregamento de um <script type="module">.
  window.addEventListener('error', function(e){
    if (e && e.target && e.target.tagName === 'SCRIPT') setTimeout(showBootError, 300);
  }, true);
  // Rede de segurança: se em 12s o app não sinalizou boot, avisa.
  window.addEventListener('DOMContentLoaded', function(){
    setTimeout(showBootError, 12000);
  });
})();
</script>

<!-- ── Flags de funcionalidades ──
     Desligadas por enquanto; é só trocar pra true quando for ativar. -->
<script>
  window.FEATURES = {
    comments: false,  // seção de comentários no perfil do lugar
    ratings:  false,  // avaliação por estrelas (nota) + contador "Avaliações"
    badges:   false,  // aba de badges no perfil
    levelXp:  false,  // barra de nível (Novato) + XP no perfil
    // "Continuar com a Apple" só em dispositivos Apple (iOS/iPadOS/macOS).
    // No Android/Windows o botão nem aparece — o login Google já cobre, e evita
    // mostrar Apple onde não faz sentido. Obrigatório no app iOS (App Store 4.8);
    // requer o provedor Apple configurado no Firebase pra funcionar de fato.
    appleSignIn: (function () {
      var ua = navigator.userAgent || '', p = navigator.platform || '';
      var iOS = /iPad|iPhone|iPod/.test(ua) || (p === 'MacIntel' && navigator.maxTouchPoints > 1);
      var mac = /Macintosh|Mac OS X/.test(ua);
      return iOS || mac;
    })(),
  };
</script>
