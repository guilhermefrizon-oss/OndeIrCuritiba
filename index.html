<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OndeIr Curitiba</title>
<style>
/* ── OndeIr Curitiba – styles.css ─────────────────────────────────
   Light mode por padrão. Dark mode via [data-theme="dark"] no <html>
──────────────────────────────────────────────────────────────────── */

/* ── Tokens de cor ───────────────────────────────────────────────── */
:root {
  --bg:    #F7F7F9;
  --bg2:   #FFFFFF;
  --bg3:   #EFEFEF;
  --bg4:   #E2E2E8;
  --bg5:   #CFCFDB;
  --p100:  #EDE9FF;
  --p200:  #C4B5FD;
  --p300:  #A78BFA;
  --p400:  #7C3AED;
  --p500:  #6D28D9;
  --acc:   #7C3AED;
  --acc2:  #A78BFA;
  --acc3:  #5B21B6;
  --text:  #0F0A1E;
  --text2: #4B4466;
  --text3: #9490A8;
  --green: #059669;
  --red:   #DC2626;
  --shadow: 0 4px 24px rgba(0,0,0,.08);
  --shadow-card: 0 12px 40px rgba(109,40,217,.15);
  --card-h: 470px;
  --r: 26px;
}

[data-theme="dark"] {
  --bg:    #0A0810;
  --bg2:   #100D1A;
  --bg3:   #181324;
  --bg4:   #221B33;
  --bg5:   #2E2445;
  --p100:  #2A1F4A;
  --p200:  #C4B5FD;
  --p300:  #A78BFA;
  --p400:  #8B5CF6;
  --p500:  #7C3AED;
  --acc:   #A78BFA;
  --acc2:  #C4B5FD;
  --acc3:  #7C3AED;
  --text:  #F2EEFF;
  --text2: #9C8FC0;
  --text3: #564E70;
  --green: #34D399;
  --red:   #F87171;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
  --shadow-card: 0 24px 60px rgba(0,0,0,.6);
}

/* ── Reset & Base ────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  transition: background .3s, color .3s;
}

.phone {
  max-width: 430px; margin: 0 auto;
  height: 100dvh; background: var(--bg);
  position: relative; display: flex; flex-direction: column;
  overflow: hidden;
}

/* ── Status bar ──────────────────────────────────────────────────── */
.status {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 24px 4px; font-size: 11px; color: var(--text3); font-weight: 500;
}

/* ── Top bar ─────────────────────────────────────────────────────── */
.topbar { padding: 8px 22px 14px; display: flex; align-items: center; justify-content: space-between; }
.wordmark { font-size: 20px; font-weight: 800; letter-spacing: -0.8px; color: var(--text); }
.wordmark em { color: var(--acc); font-style: normal; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 14px;
  background: var(--bg2); border: 1.5px solid var(--bg4);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  position: relative; box-shadow: var(--shadow); transition: background .2s;
}
.icon-btn:hover { background: var(--bg3); }
.icon-btn svg { stroke: var(--text2); }
.notif-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; background: var(--acc); border-radius: 50%; border: 2px solid var(--bg2); }

.theme-btn {
  width: 38px; height: 38px; border-radius: 14px;
  background: var(--bg2); border: 1.5px solid var(--bg4);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 17px; box-shadow: var(--shadow); transition: background .2s, transform .2s;
}
.theme-btn:hover { background: var(--bg3); transform: rotate(20deg); }

.avatar {
  width: 38px; height: 38px; border-radius: 14px;
  background: linear-gradient(135deg, var(--p500), var(--p300));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; cursor: pointer;
  overflow: hidden; box-shadow: var(--shadow);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ── Location pill ───────────────────────────────────────────────── */
.location-row { padding: 0 22px 14px; display: flex; }
.loc-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg2); border: 1.5px solid var(--bg4);
  border-radius: 100px; padding: 7px 14px;
  font-size: 13px; color: var(--text2); box-shadow: var(--shadow);
}
.loc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 8px var(--acc); }

/* ── Categories ──────────────────────────────────────────────────── */
.cats-label { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); padding: 0 22px 10px; }
.cats-scroll { display: flex; gap: 8px; padding: 0 22px 18px; overflow-x: auto; scrollbar-width: none; }
.cats-scroll::-webkit-scrollbar { display: none; }
.cat-pill {
  flex-shrink: 0; padding: 7px 15px; border-radius: 100px;
  border: 1.5px solid var(--bg4); background: var(--bg2);
  font-size: 13px; font-weight: 500; color: var(--text2);
  cursor: pointer; transition: all .18s; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
}
.cat-pill.on { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 700; box-shadow: 0 4px 20px rgba(124,58,237,.35); }

/* ── Card stack ──────────────────────────────────────────────────── */
.stack-wrap { flex: 1; position: relative; padding: 0 18px; display: flex; align-items: flex-start; justify-content: center; min-height: 0; }
.stack { position: relative; width: 100%; height: 100%; }

.place-card {
  position: absolute; width: 100%; height: 100%;
  border-radius: var(--r); overflow: hidden; cursor: grab;
  border: 1.5px solid rgba(0,0,0,.06);
  transform-origin: 50% 115%; will-change: transform;
  box-shadow: var(--shadow-card);
}
[data-theme="dark"] .place-card { border-color: rgba(255,255,255,.06); }
.place-card:active { cursor: grabbing; }

.card-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity .2s; }
.card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.04) 35%, rgba(0,0,0,.58) 62%, rgba(0,0,0,.90) 100%);
}

/* Fallback gradients */
.bg-rooftop  { background: linear-gradient(160deg,#e8e0ff 0%,#c4b5fd 45%,#7c3aed 100%); }
.bg-cafe     { background: linear-gradient(160deg,#fef3c7 0%,#fde68a 45%,#b45309 100%); }
.bg-bar      { background: linear-gradient(160deg,#dbeafe 0%,#93c5fd 45%,#1d4ed8 100%); }
.bg-balada   { background: linear-gradient(160deg,#fce7f3 0%,#f9a8d4 45%,#be185d 100%); }
.bg-romantico{ background: linear-gradient(160deg,#ffe4e6 0%,#fca5a5 45%,#b91c1c 100%); }
.bg-barato   { background: linear-gradient(160deg,#dcfce7 0%,#86efac 45%,#15803d 100%); }
.bg-alta     { background: linear-gradient(160deg,#f5f3ff 0%,#ddd6fe 45%,#5b21b6 100%); }
.bg-vegano   { background: linear-gradient(160deg,#ecfdf5 0%,#6ee7b7 45%,#047857 100%); }
.bg-pet      { background: linear-gradient(160deg,#fff7ed 0%,#fed7aa 45%,#c2410c 100%); }
.bg-insta    { background: linear-gradient(160deg,#fdf4ff 0%,#e879f9 45%,#701a75 100%); }

.card-glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 20%, rgba(167,139,250,.1) 0%, transparent 60%); }

.card-top { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; }
.cat-tag {
  background: rgba(255,255,255,.2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.35); color: #fff;
  font-size: 11px; font-weight: 700; padding: 5px 12px;
  border-radius: 100px; letter-spacing: .5px; text-transform: uppercase;
}
.price-tag {
  background: rgba(0,0,0,.28); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.15); color: #fff;
  font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 100px;
}

/* Card photo tap zones */
.card-photo-tap { position: absolute; top: 0; bottom: 42%; width: 38%; z-index: 15; cursor: pointer; }
.card-photo-tap-left  { left: 0; }
.card-photo-tap-right { right: 0; }

/* Story bars no card */
.card-story-bars { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 4px; z-index: 16; pointer-events: none; }
.card-sbar { flex: 1; height: 2px; border-radius: 2px; background: rgba(255,255,255,.22); overflow: hidden; }
.card-sbar-fill { height: 100%; width: 0; background: #fff; }
.card-sbar-fill.done { width: 100%; }

/* Card bottom */
.card-bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 22px 22px 20px; }
.card-bottom-tap { cursor: pointer; transition: background .15s; border-radius: 0 0 var(--r) var(--r); }
.card-bottom-tap:active { background: rgba(255,255,255,.04); }
.card-name { font-size: 26px; font-weight: 800; color: #fff; line-height: 1.05; margin-bottom: 4px; letter-spacing: -0.8px; }
.card-addr { font-size: 12px; color: rgba(255,255,255,.45); margin-bottom: 6px; }
.card-meta { font-size: 13px; color: rgba(255,255,255,.6); display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.meta-sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.3); }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.ig-chip {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
  border-radius: 100px; padding: 6px 12px;
  font-size: 12px; color: rgba(255,255,255,.8); font-weight: 500;
}
.card-profile-hint { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.4); letter-spacing: .3px; }

/* Stamps */
.stamp { position: absolute; top: 28px; padding: 8px 18px; border-radius: 12px; font-size: 16px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; opacity: 0; pointer-events: none; backdrop-filter: blur(8px); }
.stamp-like { left: 22px; background: rgba(52,211,153,.12); border: 2.5px solid var(--green); color: var(--green); transform: rotate(-14deg); }
.stamp-nope { right: 22px; background: rgba(248,113,113,.12); border: 2.5px solid var(--red); color: var(--red); transform: rotate(14deg); }

/* Progress dots */
.progress-row { display: flex; justify-content: center; gap: 5px; padding: 10px 0 4px; }
.pdot { width: 6px; height: 6px; border-radius: 50%; background: var(--bg4); transition: all .2s; }
.pdot.on { background: var(--acc); width: 18px; border-radius: 3px; }

/* ── Action buttons ───────────────────────────────────────────────── */
.btns { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 24px 12px; }
.abtn { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; background: none; border: none; }
.abtn .c { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid; transition: transform .12s, background .15s; box-shadow: var(--shadow); }
.abtn:active .c { transform: scale(.91); }
.abtn .lbl { font-size: 10px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; }
.b-pass .c   { border-color: var(--bg4); background: var(--bg2); color: var(--text3); }
.b-pass .lbl { color: var(--text3); }
.b-save .c   { border-color: var(--p300); background: var(--p100); color: var(--p400); }
.b-save .lbl { color: var(--p400); }
.b-like .c   { border-color: var(--green); background: rgba(5,150,105,.08); color: var(--green); }
.b-like .lbl { color: var(--green); }
[data-theme="dark"] .b-like .c { background: rgba(52,211,153,.08); }
.b-pass:hover .c { background: var(--bg3); }
.b-like:hover .c { background: rgba(5,150,105,.14); }
.b-save:hover .c { background: var(--p100); }

/* ── Bottom nav ──────────────────────────────────────────────────── */
.nav { display: flex; padding: 6px 16px env(safe-area-inset-bottom, 18px); gap: 4px; border-top: 1.5px solid var(--bg4); background: var(--bg2); flex-shrink: 0; }
.ni { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 4px; border-radius: 16px; transition: background .15s; background: none; border: none; }
.ni.on { background: var(--p100); }
.ni-icon { font-size: 19px; line-height: 1; }
.ni-lbl { font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text3); }
.ni.on .ni-lbl { color: var(--acc); }
.nbadge { background: var(--acc); color: #fff; font-size: 9px; font-weight: 700; border-radius: 100px; padding: 1px 6px; }

/* ── Saved view ──────────────────────────────────────────────────── */
.saved-view { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
.saved-header { padding: 4px 22px 14px; }
.saved-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
.saved-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
.saved-grid { display: flex; flex-direction: column; gap: 8px; padding: 0 18px 8px; }
.saved-row { display: flex; align-items: center; gap: 14px; background: var(--bg2); border: 1.5px solid var(--bg4); border-radius: 20px; padding: 12px 14px; cursor: pointer; transition: background .15s; box-shadow: var(--shadow); }
.saved-row:hover { background: var(--bg3); }
.saved-thumb { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; background-size: cover; background-position: center; }
.saved-name { font-size: 15px; font-weight: 700; letter-spacing: -.3px; color: var(--text); }
.saved-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.saved-price { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--acc); }

/* ── Empty state ─────────────────────────────────────────────────── */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 60px 40px; }
.empty-ico { width: 72px; height: 72px; border-radius: 24px; background: var(--bg3); border: 1.5px solid var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 32px; }
.empty-title { font-size: 17px; font-weight: 700; color: var(--text); }
.empty-sub { font-size: 13px; color: var(--text2); text-align: center; line-height: 1.6; }

.photo-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; opacity: .3; }

/* ── Animations ──────────────────────────────────────────────────── */
@keyframes slideUp    { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: translateY(0) } }
@keyframes profileIn  { from { opacity: 0; transform: translateY(100%) } to { opacity: 1; transform: translateY(0) } }
@keyframes profileOut { from { opacity: 1; transform: translateY(0) } to { opacity: 0; transform: translateY(100%) } }
@keyframes fadeIn     { from { opacity: 0 } to { opacity: 1 } }
@keyframes spin       { to { transform: rotate(360deg) } }

.su { animation: slideUp .32s cubic-bezier(.22,1,.36,1) both; }

/* ── Profile Screen ──────────────────────────────────────────────── */
.profile-screen {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg); display: flex; flex-direction: column;
  max-width: 390px; margin: 0 auto;
  animation: profileIn .38s cubic-bezier(.22,1,.36,1) both;
  overflow: hidden;
}
.profile-screen.closing { animation: profileOut .3s cubic-bezier(.55,0,.45,1) both; }

.profile-photo-wrap { position: relative; width: 100%; height: 300px; flex-shrink: 0; background: var(--bg3); overflow: hidden; }
.profile-photo-img { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity .22s ease; }
.profile-photo-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 80px; opacity: .18; }
.story-tap { position: absolute; top: 0; bottom: 0; width: 45%; z-index: 10; cursor: pointer; }
.story-tap-left  { left: 0; }
.story-tap-right { right: 0; }
.story-bars { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 4px; z-index: 20; }
.story-bar { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,.28); overflow: hidden; }
.story-bar-fill { height: 100%; background: #fff; width: 0%; }
.story-bar-fill.done { width: 100%; }
.profile-close {
  position: absolute; top: 14px; right: 14px; z-index: 30;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(0,0,0,.42); backdrop-filter: blur(10px);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.profile-close:hover { background: rgba(0,0,0,.65); }
.profile-photo-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, var(--bg) 0%, transparent 100%); pointer-events: none; z-index: 5; }

.profile-body { flex: 1; overflow-y: auto; padding: 0 22px 40px; scrollbar-width: none; }
.profile-body::-webkit-scrollbar { display: none; }
.profile-name { font-size: 28px; font-weight: 800; letter-spacing: -1px; color: var(--text); line-height: 1.05; margin-bottom: 6px; }
.profile-cat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.profile-cat-badge { background: var(--p100); border: 1px solid var(--p200); color: var(--p400); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; letter-spacing: .5px; text-transform: uppercase; }
.profile-price { display: flex; gap: 2px; }
.profile-price span { font-size: 13px; font-weight: 700; }
.profile-price span.active   { color: var(--acc); }
.profile-price span.inactive { color: var(--bg5); }

/* Info cards */
.profile-info-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.info-card { background: var(--bg2); border: 1.5px solid var(--bg4); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.info-card-icon { width: 36px; height: 36px; border-radius: 12px; background: var(--bg3); border: 1px solid var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.info-card-content { flex: 1; min-width: 0; }
.info-card-label { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text3); margin-bottom: 2px; }
.info-card-value { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info-card-action { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--acc); border: none; background: var(--p100); cursor: pointer; padding: 6px 12px; border-radius: 100px; white-space: nowrap; transition: background .15s; }
.info-card-action:hover { background: var(--p200); }

/* Instagram button */
.ig-btn { display: flex; align-items: center; gap: 12px; width: 100%; background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); border: none; border-radius: 18px; padding: 14px 18px; cursor: pointer; color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; margin-bottom: 10px; transition: opacity .15s, transform .12s; }
.ig-btn:hover { opacity: .92; transform: translateY(-1px); }
.ig-btn-icon { font-size: 20px; }

/* ── Comments Section ────────────────────────────────────────────── */
.comments-section { margin-top: 6px; }
.comments-title { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 14px; }

.comment-input-wrap {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--bg2); border: 1.5px solid var(--bg4);
  border-radius: 18px; padding: 12px 14px; margin-bottom: 14px;
  box-shadow: var(--shadow); transition: border-color .2s;
}
.comment-input-wrap:focus-within { border-color: var(--acc); }
.comment-avatar-mini { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg,var(--p500),var(--p300)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; overflow: hidden; }
.comment-avatar-mini img { width: 100%; height: 100%; object-fit: cover; }
.comment-textarea { flex: 1; background: none; border: none; outline: none; font-family: 'DM Sans',sans-serif; font-size: 14px; color: var(--text); resize: none; line-height: 1.5; min-height: 38px; max-height: 100px; }
.comment-textarea::placeholder { color: var(--text3); }
.comment-send-btn { background: var(--acc); color: #fff; border: none; border-radius: 10px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; align-self: flex-end; transition: background .15s, transform .12s; white-space: nowrap; }
.comment-send-btn:hover { background: var(--acc3); transform: scale(.97); }
.comment-send-btn:disabled { background: var(--bg4); color: var(--text3); cursor: default; transform: none; }

.comment-login-prompt { background: var(--bg2); border: 1.5px solid var(--bg4); border-radius: 18px; padding: 20px 16px; text-align: center; margin-bottom: 14px; box-shadow: var(--shadow); }
.comment-login-prompt p { font-size: 13px; color: var(--text2); margin-bottom: 14px; line-height: 1.6; }
.login-google-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--bg3); border: 1.5px solid var(--bg4); border-radius: 12px; padding: 10px 20px; font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; transition: background .15s; box-shadow: var(--shadow); }
.login-google-btn:hover { background: var(--bg4); }

.comment-list { display: flex; flex-direction: column; gap: 12px; }
.comment-item { display: flex; gap: 10px; animation: fadeIn .25s ease both; }

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, deleteDoc, getDocs, collection }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCz1Ti_twBmtDxGOc9cGiXHBNbFTOdvYAg",
    authDomain: "ondeircuritiba-91390.firebaseapp.com",
    projectId: "ondeircuritiba-91390",
    storageBucket: "ondeircuritiba-91390.firebasestorage.app",
    messagingSenderId: "208330257440",
    appId: "1:208330257440:web:6df311fc5c60c389117845"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  let userId = localStorage.getItem('cwb_uid');
  if (!userId) { userId = crypto.randomUUID(); localStorage.setItem('cwb_uid', userId); }

  window.fsSave = async (place) => {
    try { await setDoc(doc(db, 'favorites', userId, 'places', place.id), place); }
    catch(e) { console.warn('fsSave:', e); }
  };
  window.fsRemove = async (placeId) => {
    try { await deleteDoc(doc(db, 'favorites', userId, 'places', placeId)); }
    catch(e) { console.warn('fsRemove:', e); }
  };
  window.fsLoadAll = async () => {
    try {
      const snap = await getDocs(collection(db, 'favorites', userId, 'places'));
      return snap.docs.map(d => d.data());
    } catch(e) { console.warn('fsLoadAll:', e); return []; }
  };

  window.fsLoadPlaces = async () => {
    try {
      const snap = await getDocs(collection(db, 'places'));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) { console.warn('fsLoadPlaces:', e); return []; }
  };

  window.fsLoadCategories = async () => {
    try {
      const snap = await getDocs(collection(db, 'categories'));
      const cats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      cats.sort((a,b) => (a.order||99) - (b.order||99));
      return cats;
    } catch(e) { console.warn('fsLoadCategories:', e); return []; }
  };

  // Sinaliza que os módulos Firebase estão prontos
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<script type="module">
// ── auth.js ───────────────────────────────────────────────────────
// Gerencia autenticação Google via Firebase Auth

import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCz1Ti_twBmtDxGOc9cGiXHBNbFTOdvYAg",
  authDomain: "ondeircuritiba-91390.firebaseapp.com",
  projectId: "ondeircuritiba-91390",
  storageBucket: "ondeircuritiba-91390.firebasestorage.app",
  messagingSenderId: "208330257440",
  appId: "1:208330257440:web:6df311fc5c60c389117845"
};

// Reutiliza app já inicializado se existir
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// Estado global do usuário
window.currentUser = null;

// Observa mudanças de autenticação
onAuthStateChanged(auth, (user) => {
  window.currentUser = user;
  updateAvatarUI(user);
  // Notifica outros módulos
  window.dispatchEvent(new CustomEvent('authChanged', { detail: user }));
});

function updateAvatarUI(user) {
  const avatar = document.getElementById('topAvatar');
  if (!avatar) return;
  if (user) {
    if (user.photoURL) {
      avatar.innerHTML = `<img src="${user.photoURL}" alt="${user.displayName}">`;
    } else {
      const initials = (user.displayName || 'U').split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
      avatar.textContent = initials;
    }
    avatar.title = user.displayName || user.email;
  } else {
    avatar.innerHTML = '';
    avatar.textContent = '👤';
    avatar.title = 'Entrar';
  }
}

// Login com Google
async function signInWithGoogle() {
  try {
    await signInWithPopup(auth, provider);
    closeAuthModal();
  } catch (e) {
    console.warn('Login falhou:', e.message);
  }
}

// Logout
async function signOutUser() {
  try {
    await signOut(auth);
  } catch (e) {
    console.warn('Logout falhou:', e);
  }
}

// Modal de autenticação
function showAuthModal() {
  let backdrop = document.getElementById('authModalBackdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.className = 'auth-modal-backdrop';
    backdrop.id = 'authModalBackdrop';
    backdrop.innerHTML = `
      <div class="auth-modal">
        <div class="auth-modal-handle"></div>
        <div class="auth-modal-icon">💬</div>
        <div class="auth-modal-title">Entre para comentar</div>
        <div class="auth-modal-sub">
          Compartilhe sua experiência com outros usuários.<br>
          Faça login com sua conta Google para continuar.
        </div>
        <button class="auth-google-btn" id="authGoogleBtn">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continuar com Google
        </button>
        <button class="auth-cancel-btn" id="authCancelBtn">Agora não</button>
      </div>`;
    document.body.appendChild(backdrop);

    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeAuthModal();
    });
  }

  backdrop.style.display = 'flex';
  document.getElementById('authGoogleBtn').onclick = signInWithGoogle;
  document.getElementById('authCancelBtn').onclick = closeAuthModal;
}

function closeAuthModal() {
  const backdrop = document.getElementById('authModalBackdrop');
  if (backdrop) backdrop.style.display = 'none';
}

// Avatar clicável: se logado mostra opção de sair, se não mostra login
function handleAvatarClick() {
  if (window.currentUser) {
    if (confirm(`Sair da conta ${window.currentUser.displayName || window.currentUser.email}?`)) {
      signOutUser();
    }
  } else {
    showAuthModal();
  }
}

window.signInWithGoogle  = signInWithGoogle;
window.signOutUser       = signOutUser;
window.showAuthModal     = showAuthModal;
window.closeAuthModal    = closeAuthModal;
window.handleAvatarClick = handleAvatarClick;

</script>
<script type="module">
// ── comments.js ───────────────────────────────────────────────────
// Lógica de comentários por estabelecimento, salvos no Firestore

import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCz1Ti_twBmtDxGOc9cGiXHBNbFTOdvYAg",
  authDomain: "ondeircuritiba-91390.firebaseapp.com",
  projectId: "ondeircuritiba-91390",
  storageBucket: "ondeircuritiba-91390.firebasestorage.app",
  messagingSenderId: "208330257440",
  appId: "1:208330257440:web:6df311fc5c60c389117845"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db  = getFirestore(app);

// Unsubscribe do listener ativo (evita memory leaks ao trocar de lugar)
let activeUnsubscribe = null;

// Renderiza a seção de comentários dentro do profile-body
function renderCommentsSection(placeId) {
  // Remove seção anterior se existir
  const old = document.getElementById('commentsSection');
  if (old) old.remove();

  const section = document.createElement('div');
  section.className = 'comments-section';
  section.id = 'commentsSection';
  section.innerHTML = `
    <div class="comments-title">💬 Comentários</div>
    <div id="commentInputArea"></div>
    <div class="comment-list" id="commentList">
      <div class="comment-loading"><div class="spinner"></div></div>
    </div>`;

  const profileBody = document.getElementById('profileBody');
  if (profileBody) profileBody.appendChild(section);

  renderCommentInput(placeId);
  subscribeToComments(placeId);
}

// Renderiza o campo de input ou o prompt de login
function renderCommentInput(placeId) {
  const area = document.getElementById('commentInputArea');
  if (!area) return;

  const user = window.currentUser;

  if (user) {
    const photoHTML = user.photoURL
      ? `<img src="${user.photoURL}" alt="">`
      : (user.displayName || 'U').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();

    area.innerHTML = `
      <div class="comment-input-wrap">
        <div class="comment-avatar-mini">${user.photoURL ? `<img src="${user.photoURL}" alt="">` : photoHTML}</div>
        <textarea
          class="comment-textarea"
          id="commentTextarea"
          placeholder="Compartilhe sua experiência..."
          rows="1"
          maxlength="500"
        ></textarea>
        <button class="comment-send-btn" id="commentSendBtn" disabled>Enviar</button>
      </div>`;

    const textarea = document.getElementById('commentTextarea');
    const sendBtn  = document.getElementById('commentSendBtn');

    // Auto-resize
    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
      sendBtn.disabled = textarea.value.trim().length === 0;
    });

    sendBtn.addEventListener('click', () => submitComment(placeId, textarea, sendBtn));
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && textarea.value.trim()) {
        e.preventDefault();
        submitComment(placeId, textarea, sendBtn);
      }
    });
  } else {
    area.innerHTML = `
      <div class="comment-login-prompt">
        <p>Faça login para compartilhar sua experiência com este lugar.</p>
        <button class="login-google-btn" onclick="showAuthModal()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Entrar com Google
        </button>
      </div>`;
  }
}

// Envia comentário ao Firestore
async function submitComment(placeId, textarea, sendBtn) {
  const text = textarea.value.trim();
  if (!text || !window.currentUser) return;

  sendBtn.disabled  = true;
  sendBtn.textContent = '...';

  try {
    await addDoc(collection(db, 'comments', placeId, 'items'), {
      text,
      userId:      window.currentUser.uid,
      userName:    window.currentUser.displayName || 'Usuário',
      userPhoto:   window.currentUser.photoURL || null,
      createdAt:   serverTimestamp()
    });
    textarea.value = '';
    textarea.style.height = 'auto';
    sendBtn.textContent = 'Enviar';
  } catch (e) {
    console.warn('Erro ao enviar comentário:', e);
    sendBtn.textContent = 'Erro';
    setTimeout(() => { sendBtn.textContent = 'Enviar'; sendBtn.disabled = false; }, 2000);
  }
}

// Escuta comentários em tempo real
function subscribeToComments(placeId) {
  if (activeUnsubscribe) activeUnsubscribe();

  const q = query(
    collection(db, 'comments', placeId, 'items'),
    orderBy('createdAt', 'desc')
  );

  activeUnsubscribe = onSnapshot(q, (snap) => {
    const list = document.getElementById('commentList');
    if (!list) return;

    if (snap.empty) {
      list.innerHTML = '<div class="comment-empty">Nenhum comentário ainda. Seja o primeiro! 🙌</div>';
      return;
    }

    list.innerHTML = '';
    snap.forEach(docSnap => {
      const c = docSnap.data();
      const dateStr = c.createdAt?.toDate
        ? formatDate(c.createdAt.toDate())
        : 'agora';

      const initials = (c.userName || 'U').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
      const avatarHTML = c.userPhoto
        ? `<img src="${c.userPhoto}" alt="${c.userName}">`
        : initials;

      const item = document.createElement('div');
      item.className = 'comment-item';
      item.innerHTML = `
        <div class="comment-user-avatar">${avatarHTML}</div>
        <div class="comment-bubble">
          <div class="comment-bubble-header">
            <span class="comment-user-name">${escapeHTML(c.userName)}</span>
            <span class="comment-date">${dateStr}</span>
          </div>
          <div class="comment-text">${escapeHTML(c.text)}</div>
        </div>`;
      list.appendChild(item);
    });
  }, (err) => {
    console.warn('Erro ao carregar comentários:', err);
    const list = document.getElementById('commentList');
    if (list) list.innerHTML = '<div class="comment-empty">Não foi possível carregar comentários.</div>';
  });
}

// Limpa listener ao fechar perfil
function unsubscribeComments() {
  if (activeUnsubscribe) {
    activeUnsubscribe();
    activeUnsubscribe = null;
  }
}

// Helpers
function formatDate(date) {
  const now  = new Date();
  const diff = Math.floor((now - date) / 1000);
  if (diff < 60)   return 'agora';
  if (diff < 3600) return `${Math.floor(diff/60)}min`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  return date.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}

function escapeHTML(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Atualiza input quando autenticação muda
window.addEventListener('authChanged', (e) => {
  const placeId = window._currentProfilePlaceId;
  if (placeId) renderCommentInput(placeId);
});

window.renderCommentsSection  = renderCommentsSection;
window.unsubscribeComments    = unsubscribeComments;

</script>

<script>
const GOOGLE_API_KEY = 'AIzaSyDiLhxU3veHWvx3fvA6kk6TluFFHYWHEzs';
const photoCache  = {};
const photoCache2 = {};

async function fetchPlacePhoto(placeId) {
  if (!placeId || placeId.startsWith('ID_GOOGLE_')) return null;
  if (photoCache[placeId]) return photoCache[placeId];
  try {
    const res  = await fetch(`https://places.googleapis.com/v1/places/${placeId}?fields=photos&key=${GOOGLE_API_KEY}`, { headers: {'X-Goog-FieldMask':'photos'} });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.photos?.length) return null;
    const url = `https://places.googleapis.com/v1/${data.photos[0].name}/media?maxHeightPx=800&maxWidthPx=600&key=${GOOGLE_API_KEY}`;
    photoCache[placeId] = url;
    return url;
  } catch(e) { return null; }
}

async function fetchAllPhotos(placeId) {
  if (!placeId || placeId.startsWith('ID_GOOGLE_')) return [];
  if (photoCache2[placeId]) return photoCache2[placeId];
  try {
    const res  = await fetch(`https://places.googleapis.com/v1/places/${placeId}?fields=photos&key=${GOOGLE_API_KEY}`, { headers: {'X-Goog-FieldMask':'photos'} });
    if (!res.ok) return [];
    const data = await res.json();
    if (!data.photos) return [];
    const urls = data.photos.slice(0,8).map(ph =>
      `https://places.googleapis.com/v1/${ph.name}/media?maxHeightPx=900&maxWidthPx=600&key=${GOOGLE_API_KEY}`
    );
    photoCache2[placeId] = urls;
    return urls;
  } catch(e) { return []; }
}

// ─── Lugares e Categorias carregados do Firestore ─────────────────
// Lugares carregados do Firestore (substituem o array hardcoded)
let P = [];

let CATS = ["Todos","Café da tarde","Barzinho","Céu aberto","Balada","Romântico","Baratinho","Alta gastronomia","Vegano","Pet friendly","Instagramável"];
let CE   = {"Todos":"🗺️","Café da tarde":"☕","Barzinho":"🍸","Céu aberto":"🌆","Balada":"🎵","Romântico":"🕯️","Baratinho":"🍔","Alta gastronomia":"⭐","Vegano":"🌱","Pet friendly":"🐾","Instagramável":"📸"};

let cat="Todos", filtered=[...P], idx=0, saved=[];
let drag=false, sx=0, cx=0, dragStartedOnPhoto=false;

// ─── City Selector ────────────────────────────────────────────────
let currentCity = 'Curitiba, PR';

function openCitySheet(){
  document.getElementById('citySheetBackdrop').style.display='flex';
}
function closeCitySheet(e){

  document.getElementById('citySheetBackdrop').style.display='none';
}
function selectCity(city, id){

  document.getElementById('cityLabel').textContent = city;

  document.querySelectorAll('.city-option').forEach(b => {

// ─── Card photo navigation ─────────────────────────────────────────
let cardPhotos=[], cardPhotoIdx=0;

function initCardPhotos(p) {
  cardPhotos=[]; cardPhotoIdx=0;
  updateCardStoryBars();

  const tapL = document.getElementById('cardTapLeft');
  const tapR = document.getElementById('cardTapRight');

  // Usa touchstart/touchend para distinguir tap (sem movimento) de drag
  function bindTap(el, fn) {
    if(!el) return;
    let tsX = 0;
    el.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, {passive:true});
    el.addEventListener('touchend', e => {
      if(Math.abs(e.changedTouches[0].clientX - tsX) < 15) { e.stopPropagation(); fn(); }
    });
    // Mouse também funciona
    el.addEventListener('click', e => { e.stopPropagation(); fn(); });
  }

  bindTap(tapL, cardPhotoPrev);
  bindTap(tapR, cardPhotoNext);

  if (!p.pid || p.pid.startsWith('ID_GOOGLE_')) return;
  fetchAllPhotos(p.pid).then(urls => {
    if (!urls.length) return;
    cardPhotos=urls; cardPhotoIdx=0;
    updateCardStoryBars();
  });
}

function setCardPhoto(i) {
  const stack = document.getElementById('cardStack');
  const bg = stack.querySelector('.place-card[data-top="1"] .card-bg');
  if (!bg || !cardPhotos.length) return;
  bg.style.opacity='0';
  setTimeout(() => {
    bg.style.backgroundImage=`url("${cardPhotos[i]}")`;
    bg.style.backgroundSize='cover';
    bg.style.opacity='1';
    const fl = bg.querySelector('.photo-loading');
    if (fl) fl.style.opacity='0';
  }, 150);
}

function updateCardStoryBars() {
  const bars = document.getElementById('cardStoryBars');
  if (!bars) return;
  if (cardPhotos.length <= 1) { bars.innerHTML=''; return; }
  bars.innerHTML='';
  for (let i=0; i<cardPhotos.length; i++) {
    const bar=document.createElement('div'); bar.className='card-sbar';
    const fill=document.createElement('div'); fill.className='card-sbar-fill'+(i<=cardPhotoIdx?' done':'');
    bar.appendChild(fill); bars.appendChild(bar);
  }
}

function cardPhotoNext() {
  if (!cardPhotos.length || cardPhotoIdx>=cardPhotos.length-1) return;
  cardPhotoIdx++; setCardPhoto(cardPhotoIdx); updateCardStoryBars();
}
function cardPhotoPrev() {
  if (!cardPhotos.length || cardPhotoIdx<=0) return;
  cardPhotoIdx--; setCardPhoto(cardPhotoIdx); updateCardStoryBars();
}

// ─── Init ─────────────────────────────────────────────────────────
async function init(){
  // Mostra loading nos cards enquanto busca do Firestore
  const stack = document.getElementById('cardStack');
  if (stack) stack.innerHTML = `
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text3)">
      <div style="width:36px;height:36px;border:3px solid var(--bg4);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite"></div>
      <span style="font-size:14px">Carregando lugares…</span>
    </div>`;

  // Carrega categorias e lugares do Firestore em paralelo
  if (typeof window.fsLoadCategories === 'function' && typeof window.fsLoadPlaces === 'function') {
    const [cats, places] = await Promise.all([
      window.fsLoadCategories(),
      window.fsLoadPlaces(),
    ]);

    // Atualiza categorias se vieram do Firestore
    if (cats.length) {
      CATS = ['Todos', ...cats.map(c => c.name)];
      CE   = { 'Todos': '🗺️' };
      cats.forEach(c => { CE[c.name] = c.emoji || ''; });
    }

    // Atualiza lugares se vieram do Firestore
    if (places.length) {
      P = places;
    }
  }

  filtered = [...P];

  const row = document.getElementById('catsRow');
  row.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat-pill'+(c===cat?' on':'');
    b.innerHTML = `<span style="font-size:13px">${CE[c]||''}</span>${c}`;
    b.onclick = () => setCat(c);
    row.appendChild(b);
  });
  renderCard();
  renderProgress();
  if (typeof window.fsLoadAll==='function') {
    window.fsLoadAll().then(places => {
      if (places?.length) {
        saved=places;
        const b=document.getElementById('nbadge');
        b.style.display='inline'; b.textContent=saved.length;
      }
    });
  }
}

function setCat(c){
  cat=c;
  document.querySelectorAll('.cat-pill').forEach((b,i) => b.classList.toggle('on', CATS[i]===c));
  filtered = c==='Todos' ? [...P] : P.filter(p => {
    const placeCats = Array.isArray(p.cats) ? p.cats : (p.c ? [p.c] : []);
    return placeCats.includes(c);
  });
  idx=0; renderCard(); renderProgress();
}

function place(){ return filtered[idx % filtered.length]; }

function renderProgress(){
  const row=document.getElementById('progressRow');
  const total=Math.min(filtered.length,5);
  row.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='pdot'+(i===idx%total?' on':'');
    row.appendChild(d);
  }
}

// ─── Cards ────────────────────────────────────────────────────────
function renderCard(){
  const stack=document.getElementById('cardStack');
  stack.querySelectorAll('.place-card').forEach(e=>e.remove());
  if(!filtered.length) return;

  for(let i=Math.min(2,filtered.length-1);i>=0;i--){
    const p=filtered[(idx+i)%filtered.length];
    const card=makeCard(p);
    if(i>0){
      card.style.transform=`translateY(${i*10}px) scale(${1-i*0.04})`;
      card.style.zIndex=10-i;
      card.style.opacity=1-i*0.2;
      card.style.pointerEvents='none';
    } else {
      card.style.zIndex=20;
      card.dataset.top='1';
      bindDrag(card);
    }
    stack.appendChild(card);
  }

  const top=filtered[idx%filtered.length];
  if(top.pid && !top.pid.startsWith('ID_GOOGLE_')){
    fetchPlacePhoto(top.pid).then(url=>{
      if(!url) return;
      const bg=stack.querySelector('.place-card[data-top="1"] .card-bg');
      if(bg){ bg.style.backgroundImage=`url("${url}")`; bg.style.backgroundSize='cover'; }
    });
  }
  initCardPhotos(top);
}

function makeCard(p){
  const el=document.createElement('div');
  el.className='place-card su';
  el.innerHTML=`
    <div class="card-bg bg-${p.bg}"><div class="photo-loading">${p.e}</div></div>
    <div class="card-overlay"></div>
    <div class="card-glow"></div>
    <div class="card-top">
      <div class="cat-tag">${p.c}</div>
      <div class="price-tag">${p.p}</div>
    </div>
    <div class="card-story-bars" id="cardStoryBars"></div>
    <div class="card-photo-tap card-photo-tap-left"  id="cardTapLeft"></div>
    <div class="card-photo-tap card-photo-tap-right" id="cardTapRight"></div>
    <div class="card-bottom card-bottom-tap" onclick="event.stopPropagation();openProfile(filtered[idx%filtered.length])">
      <div class="card-name">${p.n}</div>
      <div class="card-addr">📍 ${p.a}</div>
      <div class="card-meta">
        <span>${p.b}</span><div class="meta-sep"></div><span>🕐 ${p.h}</span>
      </div>
      <div class="card-footer">
        <div class="ig-chip"><span style="font-size:12px">📷</span>${p.ig}</div>
        <div class="card-profile-hint">Ver perfil →</div>
      </div>
    </div>`;
  return el;
}

// ─── Drag ─────────────────────────────────────────────────────────
// Referências globais dos listeners para poder remover antes de recriar
// ─── Drag & Swipe ─────────────────────────────────────────────────
// Estado global limpo
let activeCard = null;
let dragActive  = false;
let dragStartX  = 0;
let dragStartY  = 0;
let dragCurX    = 0;
let dragLocked  = false; // true = decidiu que é drag horizontal

function bindDrag(card){
  activeCard = card;

  card.addEventListener('touchstart', onDragStart, {passive:true});
  card.addEventListener('mousedown',  onDragStart);
}

function onDragStart(e){
  const t = e.target;
  // Clique no bottom abre perfil, não inicia drag
  if(t.closest('.card-bottom-tap')) return;

  dragActive = true;
  dragLocked = false;
  dragCurX   = 0;

  const pt   = e.touches ? e.touches[0] : e;
  dragStartX = pt.clientX;
  dragStartY = pt.clientY;

  if(activeCard) activeCard.style.transition = 'none';
}

function onDragMove(e){
  if(!dragActive || !activeCard) return;

  const pt  = e.touches ? e.touches[0] : e;
  const dx  = pt.clientX - dragStartX;
  const dy  = pt.clientY - dragStartY;

  // Decide direção na primeira movimentação significativa
  if(!dragLocked){
    if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    if(Math.abs(dy) > Math.abs(dx)){
      // Movimento vertical → cancela drag
      dragActive = false;
      return;
    }
    dragLocked = true;
  }

  if(e.cancelable) e.preventDefault();

  dragCurX = dx;
  const rot = dx * 0.055;
  activeCard.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;

  // Stamps
  const ls = document.getElementById('likeStamp');
  const ns = document.getElementById('nopeStamp');
  const t  = Math.abs(dx) > 30 ? Math.min((Math.abs(dx)-30)/90, 1) : 0;
  if(dx > 30)       { ls.style.opacity = t; ns.style.opacity = 0; }
  else if(dx < -30) { ns.style.opacity = t; ls.style.opacity = 0; }
  else              { ls.style.opacity = 0; ns.style.opacity = 0; }
}

function onDragEnd(){
  if(!dragActive || !activeCard){ dragActive = false; return; }
  dragActive = false;

  document.getElementById('likeStamp').style.opacity = 0;
  document.getElementById('nopeStamp').style.opacity = 0;

  const threshold = window.innerWidth * 0.30;
  const card = activeCard;

  if(dragCurX > threshold){
    animateOut(card, 'right');
    doSave(place());
    setTimeout(nextCard, 380);
  } else if(dragCurX < -threshold){
    animateOut(card, 'left');
    setTimeout(nextCard, 380);
  } else {
    // Volta com mola
    card.style.transition = 'transform .45s cubic-bezier(.34,1.4,.64,1)';
    card.style.transform  = '';
  }
  dragCurX = 0;
}

function animateOut(card, dir){
  const x   = dir === 'right' ? '130%' : '-130%';
  const rot = dir === 'right' ? '25deg' : '-25deg';
  card.style.transition = 'transform .38s cubic-bezier(.4,0,.2,1), opacity .35s';
  card.style.transform  = `translateX(${x}) rotate(${rot})`;
  card.style.opacity    = '0';
}

function nextCard(){
  idx = (idx + 1) % filtered.length;
  renderCard();
  renderProgress();
}

// Listeners globais — adicionados uma única vez
document.addEventListener('touchmove', onDragMove, {passive:false});
document.addEventListener('mousemove', onDragMove);
document.addEventListener('touchend',  onDragEnd);
document.addEventListener('mouseup',   onDragEnd);

// ─── Swipe pelos botões ────────────────────────────────────────────
function swipe(dir){
  if(!activeCard) return;
  if(dir === 'right') doSave(place());
  animateOut(activeCard, dir);
  setTimeout(nextCard, 380);
}

function swipeCard(card, dir){ swipe(dir); }

function savePlace(){ doSave(place()); swipe('right'); }

function doSave(p){
  if(!saved.find(s=>s.id===p.id)){
    saved.push(p);
    const b=document.getElementById('nbadge');
    b.style.display='inline'; b.textContent=saved.length;
    if(typeof window.fsSave==='function') window.fsSave(p);
  }
}

// ─── Aba Salvos ───────────────────────────────────────────────────
function renderSaved(){
  const g=document.getElementById('savedGrid');
  const e=document.getElementById('emptyMsg');
  const sub=document.getElementById('savedSubtitle');
  g.innerHTML='';
  if(!saved.length){ e.style.display='flex'; sub.textContent='Nenhum lugar ainda'; return; }
  e.style.display='none';
  sub.textContent=`${saved.length} lugar${saved.length>1?'es':''} salvo${saved.length>1?'s':''}`;
  saved.forEach(p=>{
    const row=document.createElement('div');
    row.className='saved-row su';
    row.onclick=()=>openProfile(p);
    const thumb=`<div class="saved-thumb bg-${p.bg}" id="thumb-${p.id}">${p.e}</div>`;
    row.innerHTML=`${thumb}
      <div>
        <div class="saved-name">${p.n}</div>
        <div class="saved-meta">${p.c} · ${p.b} · ${p.h}</div>
      </div>
      <div class="saved-price">${p.p}</div>`;
    g.appendChild(row);
    if(p.pid && !p.pid.startsWith('ID_GOOGLE_')){
      fetchPlacePhoto(p.pid).then(url=>{
        if(!url) return;
        const t=document.getElementById(`thumb-${p.id}`);
        if(t){ t.style.backgroundImage=`url("${url}")`; t.textContent=''; }
      });
    }
  });
}

function showTab(t){
  const disc=document.getElementById('discoverView');
  const sv=document.getElementById('savedView');
  ['navDiscover','navSaved','navMap'].forEach(id=>document.getElementById(id)?.classList.remove('on'));

  disc.style.display=t==='discover'?'flex':'none';
  sv.style.display=t==='saved'?'flex':'none';
  if(t==='saved') renderSaved();
}

      </div>
      <button class="info-card-action" onclick="event.stopPropagation();openAddrSheet('${addrEsc}')">Ver opções</button>
    </div>
    <div class="info-card">
      <div class="info-card-icon">🏘️</div>
      <div class="info-card-content">
        <div class="info-card-label">Bairro</div>
        <div class="info-card-value">${p.b}</div>
      </div>
    </div>
    <div class="info-card">
      <div class="info-card-icon">🕐</div>
      <div class="info-card-content">
        <div class="info-card-label">Horário</div>
        <div class="info-card-value">${p.h}</div>
      </div>
    </div>`;

  // Comentários
  if (typeof window.renderCommentsSection==='function') {
    window.renderCommentsSection(p.id);
  }

  // Story bars placeholder
  document.getElementById('storyBars').innerHTML='<div class="story-bar"><div class="story-bar-fill"></div></div>';

  fetchAllPhotos(p.pid).then(urls=>{
    if(!urls.length) return;
    profilePhotos=urls; profilePhotoIdx=0;
    updateProfileStoryBars();
    setProfilePhoto(0);
  });

  document.getElementById('storyTapLeft').onclick=()=>storyPrev();
  document.getElementById('storyTapRight').onclick=()=>storyNext();
  document.getElementById('profileClose').onclick=closeProfile;
}

function setProfilePhoto(i){
  if(!profilePhotos.length) return;
  const img=document.getElementById('profilePhotoImg');
  img.style.opacity='0';
  setTimeout(()=>{ img.style.backgroundImage=`url("${profilePhotos[i]}")`; img.style.opacity='1'; },100);
}

function updateProfileStoryBars(){
  const bars=document.getElementById('storyBars');
  const total=Math.max(profilePhotos.length,1);
  bars.innerHTML='';
  for(let i=0;i<total;i++){
    const bar=document.createElement('div'); bar.className='story-bar';
    const fill=document.createElement('div');
    fill.className='story-bar-fill'+(i<profilePhotoIdx?' done':'');
    if(i===profilePhotoIdx) fill.style.width='100%';
    bar.appendChild(fill); bars.appendChild(bar);
  }
}

function storyNext(){
  if(!profilePhotos.length||profilePhotoIdx>=profilePhotos.length-1) return;
  profilePhotoIdx++; setProfilePhoto(profilePhotoIdx); updateProfileStoryBars();
}
function storyPrev(){
  if(!profilePhotos.length||profilePhotoIdx<=0) return;
  profilePhotoIdx--; setProfilePhoto(profilePhotoIdx); updateProfileStoryBars();
}

function closeProfile(){
  const screen=document.getElementById('profileScreen');
  screen.classList.add('closing');
  if(typeof window.unsubscribeComments==='function') window.unsubscribeComments();
  setTimeout(()=>{ screen.style.display='none'; },300);
}

// ─── Address Sheet ─────────────────────────────────────────────────
function openAddrSheet(addr){
  document.getElementById('addrSheetTitle').textContent=addr;
  document.getElementById('addrBtnMaps').onclick=()=>{
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr+', Curitiba, PR')}`,'_blank');
    closeAddrSheet();
  };
  document.getElementById('addrBtnCopy').onclick=()=>{
    navigator.clipboard.writeText(addr+', Curitiba, PR').then(()=>{
      document.getElementById('addrBtnCopy').innerHTML='<span class="addr-sheet-btn-icon">✅</span> Copiado!';
      setTimeout(closeAddrSheet,1000);
    });
  };
  document.getElementById('addrSheetBackdrop').style.display='flex';
}
function closeAddrSheet(e){
  if(e && e.target!==document.getElementById('addrSheetBackdrop')) return;
  document.getElementById('addrSheetBackdrop').style.display='none';
}

// Aguarda o módulo Firebase estar pronto antes de inicializar
if (typeof window.fsLoadPlaces === 'function') {
  init();
} else {
  window.addEventListener('firebase-ready', () => init(), { once: true });
}
</script>
</body>
</html>
