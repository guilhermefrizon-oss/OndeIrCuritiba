<!-- Firebase SDK + Firestore (favorites) -->
<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, deleteDoc, getDocs, collection }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCz1Ti_twBmtDxGOc9cGiXHBNbFTOdvYAg",
    authDomain: "ondeircuritiba-91390.firebaseapp.com",
    projectId: "ondeircuritiba-91390",
    storageBucket: "ondeircuritiba-91390.firebasestorage.app",
    messagingSenderId: "208330257440",
    appId: "1:208330257440:web:6df311fc5c60c389117845"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  let userId = localStorage.getItem('cwb_uid');
  if (!userId) { userId = crypto.randomUUID(); localStorage.setItem('cwb_uid', userId); }

  window.fsSave = async (place) => {
    try { await setDoc(doc(db, 'favorites', userId, 'places', place.id), place); }
    catch(e) { console.warn('fsSave:', e); }
  };
  window.fsRemove = async (placeId) => {
    try { await deleteDoc(doc(db, 'favorites', userId, 'places', placeId)); }
    catch(e) { console.warn('fsRemove:', e); }
  };
  window.fsLoadAll = async () => {
    try {
      const snap = await getDocs(collection(db, 'favorites', userId, 'places'));
      return snap.docs.map(d => d.data());
    } catch(e) { console.warn('fsLoadAll:', e); return []; }
  };
</script>

const GOOGLE_API_KEY = 'AIzaSyDiLhxU3veHWvx3fvA6kk6TluFFHYWHEzs';
const photoCache  = {};
const photoCache2 = {};

async function fetchPlacePhoto(placeId) {
  if (!placeId || placeId.startsWith('ID_GOOGLE_')) return null;
  if (photoCache[placeId]) return photoCache[placeId];
  try {
    const res  = await fetch(`https://places.googleapis.com/v1/places/${placeId}?fields=photos&key=${GOOGLE_API_KEY}`, { headers: {'X-Goog-FieldMask':'photos'} });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.photos?.length) return null;
    const url = `https://places.googleapis.com/v1/${data.photos[0].name}/media?maxHeightPx=800&maxWidthPx=600&key=${GOOGLE_API_KEY}`;
    photoCache[placeId] = url;
    return url;
  } catch(e) { return null; }
}

async function fetchAllPhotos(placeId) {
  if (!placeId || placeId.startsWith('ID_GOOGLE_')) return [];
  if (photoCache2[placeId]) return photoCache2[placeId];
  try {
    const res  = await fetch(`https://places.googleapis.com/v1/places/${placeId}?fields=photos&key=${GOOGLE_API_KEY}`, { headers: {'X-Goog-FieldMask':'photos'} });
    if (!res.ok) return [];
    const data = await res.json();
    if (!data.photos) return [];
    const urls = data.photos.slice(0,8).map(ph =>
      `https://places.googleapis.com/v1/${ph.name}/media?maxHeightPx=900&maxWidthPx=600&key=${GOOGLE_API_KEY}`
    );
    photoCache2[placeId] = urls;
    return urls;
  } catch(e) { return []; }
}

let drag=false, sx=0, cx=0, dragStartedOnPhoto=false;

// ─── Card photo navigation ─────────────────────────────────────────
let cardPhotos=[], cardPhotoIdx=0;

function initCardPhotos(p) {
  cardPhotos=[]; cardPhotoIdx=0;
  updateCardStoryBars();
  const tapL = document.getElementById('cardTapLeft');
  const tapR = document.getElementById('cardTapRight');
  if (tapL) tapL.onclick = (e) => { e.stopPropagation(); cardPhotoPrev(); };
  if (tapR) tapR.onclick = (e) => { e.stopPropagation(); cardPhotoNext(); };
  if (!p.pid || p.pid.startsWith('ID_GOOGLE_')) return;
  fetchAllPhotos(p.pid).then(urls => {
    if (!urls.length) return;
    cardPhotos=urls; cardPhotoIdx=0;
    updateCardStoryBars();
  });
}

function setCardPhoto(i) {
  const stack = document.getElementById('cardStack');
  const bg = stack.querySelector('.place-card[data-top="1"] .card-bg');
  if (!bg || !cardPhotos.length) return;
  bg.style.opacity='0';
  setTimeout(() => {
    bg.style.backgroundImage=`url("${cardPhotos[i]}")`;
    bg.style.backgroundSize='cover';
    bg.style.opacity='1';
    const fl = bg.querySelector('.photo-loading');
    if (fl) fl.style.opacity='0';
  }, 150);
}

function updateCardStoryBars() {
  const bars = document.getElementById('cardStoryBars');
  if (!bars) return;
  if (cardPhotos.length <= 1) { bars.innerHTML=''; return; }
  bars.innerHTML='';
  for (let i=0; i<cardPhotos.length; i++) {
    const bar=document.createElement('div'); bar.className='card-sbar';
    const fill=document.createElement('div'); fill.className='card-sbar-fill'+(i<=cardPhotoIdx?' done':'');
    bar.appendChild(fill); bars.appendChild(bar);
  }
}

function cardPhotoNext() {
  if (!cardPhotos.length || cardPhotoIdx>=cardPhotos.length-1) return;
  cardPhotoIdx++; setCardPhoto(cardPhotoIdx); updateCardStoryBars();
}
function cardPhotoPrev() {
  if (!cardPhotos.length || cardPhotoIdx<=0) return;
  cardPhotoIdx--; setCardPhoto(cardPhotoIdx); updateCardStoryBars();
}

// ─── Init ─────────────────────────────────────────────────────────
function init(){
  const row = document.getElementById('catsRow');
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat-pill'+(c===cat?' on':'');
    b.innerHTML = `<span style="font-size:13px">${CE[c]||''}</span>${c}`;
    b.onclick = () => setCat(c);
    row.appendChild(b);
  });
  renderCard();
  renderProgress();
  if (typeof window.fsLoadAll==='function') {
    window.fsLoadAll().then(places => {
      if (places?.length) {
        saved=places;
        const b=document.getElementById('nbadge');
        b.style.display='inline'; b.textContent=saved.length;
      }
    });
  }
}

function setCat(c){
  cat=c;
  document.querySelectorAll('.cat-pill').forEach((b,i) => b.classList.toggle('on', CATS[i]===c));
  filtered = c==='Todos' ? [...P] : P.filter(p => p.c===c);
  idx=0; renderCard(); renderProgress();
}

function place(){ return filtered[idx % filtered.length]; }

function renderProgress(){
  const row=document.getElementById('progressRow');
  const total=Math.min(filtered.length,5);
  row.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='pdot'+(i===idx%total?' on':'');
    row.appendChild(d);
  }
}

// ─── Cards ────────────────────────────────────────────────────────
function renderCard(){
  const stack=document.getElementById('cardStack');
  stack.querySelectorAll('.place-card').forEach(e=>e.remove());
  if(!filtered.length) return;

  for(let i=Math.min(2,filtered.length-1);i>=0;i--){
    const p=filtered[(idx+i)%filtered.length];
    const card=makeCard(p);
    if(i>0){
      card.style.transform=`translateY(${i*10}px) scale(${1-i*0.04})`;
      card.style.zIndex=10-i;
      card.style.opacity=1-i*0.2;
      card.style.pointerEvents='none';
    } else {
      card.style.zIndex=20;
      card.dataset.top='1';
      bindDrag(card);
    }
    stack.appendChild(card);
  }

  const top=filtered[idx%filtered.length];
  if(top.pid && !top.pid.startsWith('ID_GOOGLE_')){
    fetchPlacePhoto(top.pid).then(url=>{
      if(!url) return;
      const bg=stack.querySelector('.place-card[data-top="1"] .card-bg');
      if(bg){ bg.style.backgroundImage=`url("${url}")`; bg.style.backgroundSize='cover'; }
    });
  }
  initCardPhotos(top);
}

function makeCard(p){
  const el=document.createElement('div');
  el.className='place-card su';
  el.innerHTML=`
    <div class="card-bg bg-${p.bg}"><div class="photo-loading">${p.e}</div></div>
    <div class="card-overlay"></div>
    <div class="card-glow"></div>
    <div class="card-top">
      <div class="cat-tag">${p.c}</div>
      <div class="price-tag">${p.p}</div>
    </div>
    <div class="card-story-bars" id="cardStoryBars"></div>
    <div class="card-photo-tap card-photo-tap-left"  id="cardTapLeft"></div>
    <div class="card-photo-tap card-photo-tap-right" id="cardTapRight"></div>
    <div class="card-bottom card-bottom-tap" onclick="event.stopPropagation();openProfile(filtered[idx%filtered.length])">
      <div class="card-name">${p.n}</div>
      <div class="card-addr">📍 ${p.a}</div>
      <div class="card-meta">
        <span>${p.b}</span><div class="meta-sep"></div><span>🕐 ${p.h}</span>
      </div>
      <div class="card-footer">
        <div class="ig-chip"><span style="font-size:12px">📷</span>${p.ig}</div>
        <div class="card-profile-hint">Ver perfil →</div>
      </div>
    </div>`;
  return el;
}

// ─── Drag ─────────────────────────────────────────────────────────
function bindDrag(card){
  const onStart = e => {
    const t=e.target;
    if(t.closest('.card-bottom-tap') || t.closest('.card-photo-tap')) {
      dragStartedOnPhoto=false; return;
    }
    dragStartedOnPhoto=true;
    drag=true; sx=(e.touches?e.touches[0].clientX:e.clientX); cx=0;
    card.style.transition='none';
  };
  const onMove = e => {
    if(!drag) return;
    cx=(e.touches?e.touches[0].clientX:e.clientX)-sx;
    const rot=cx*.065, ty=Math.abs(cx)*.04;
    card.style.transform=`translateX(${cx}px) rotate(${rot}deg) translateY(${ty}px)`;
    const ls=document.getElementById('likeStamp'), ns=document.getElementById('nopeStamp');
    const t=Math.abs(cx)>50?Math.min((Math.abs(cx)-50)/80,1):0;
    if(cx>50){ls.style.opacity=t;ns.style.opacity=0;}
    else if(cx<-50){ns.style.opacity=t;ls.style.opacity=0;}
    else{ls.style.opacity=0;ns.style.opacity=0;}
  };
  const onEnd = () => {
    if(!drag) return; drag=false;
    document.getElementById('likeStamp').style.opacity=0;
    document.getElementById('nopeStamp').style.opacity=0;
    if(Math.abs(cx)>110){ cx>0?swipe('right'):swipe('left'); }
    else{ card.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)'; card.style.transform=''; }
    cx=0;
  };
  card.addEventListener('mousedown',onStart);
  card.addEventListener('touchstart',onStart,{passive:true});
  document.addEventListener('mousemove',onMove);
  document.addEventListener('touchmove',onMove,{passive:true});
  document.addEventListener('mouseup',onEnd);
  document.addEventListener('touchend',onEnd);
}

// ─── Swipe / Save ─────────────────────────────────────────────────
function swipe(dir){
  const card=document.querySelector('.place-card[data-top="1"]');
  if(!card) return;
  const p=place();
  card.style.transition='transform .4s cubic-bezier(.25,.46,.45,.94),opacity .35s';
  card.style.transform=dir==='right'?'translateX(650px) rotate(24deg)':'translateX(-650px) rotate(-24deg)';
  card.style.opacity='0';
  if(dir==='right') doSave(p);
  setTimeout(()=>{ idx=(idx+1)%filtered.length; renderCard(); renderProgress(); },370);
}

function savePlace(){ doSave(place()); swipe('right'); }

function doSave(p){
  if(!saved.find(s=>s.id===p.id)){
    saved.push(p);
    const b=document.getElementById('nbadge');
    b.style.display='inline'; b.textContent=saved.length;
    if(typeof window.fsSave==='function') window.fsSave(p);
  }
}

// ─── Aba Salvos ───────────────────────────────────────────────────
function renderSaved(){
  const g=document.getElementById('savedGrid');
  const e=document.getElementById('emptyMsg');
  const sub=document.getElementById('savedSubtitle');
  g.innerHTML='';
  if(!saved.length){ e.style.display='flex'; sub.textContent='Nenhum lugar ainda'; return; }
  e.style.display='none';
  sub.textContent=`${saved.length} lugar${saved.length>1?'es':''} salvo${saved.length>1?'s':''}`;
  saved.forEach(p=>{
    const row=document.createElement('div');
    row.className='saved-row su';
    row.onclick=()=>openProfile(p);
    const thumb=`<div class="saved-thumb bg-${p.bg}" id="thumb-${p.id}">${p.e}</div>`;
    row.innerHTML=`${thumb}
      <div>
        <div class="saved-name">${p.n}</div>
        <div class="saved-meta">${p.c} · ${p.b} · ${p.h}</div>
      </div>
      <div class="saved-price">${p.p}</div>`;
    g.appendChild(row);
    if(p.pid && !p.pid.startsWith('ID_GOOGLE_')){
      fetchPlacePhoto(p.pid).then(url=>{
        if(!url) return;
        const t=document.getElementById(`thumb-${p.id}`);
        if(t){ t.style.backgroundImage=`url("${url}")`; t.textContent=''; }
      });
    }
  });
}

function showTab(t){
  const disc=document.getElementById('discoverView');
  const sv=document.getElementById('savedView');
  ['navDiscover','navSaved','navMap'].forEach(id=>document.getElementById(id)?.classList.remove('on'));
  document.getElementById(t==='discover'?'navDiscover':t==='saved'?'navSaved':'navMap')?.classList.add('on');
  disc.style.display=t==='discover'?'flex':'none';
  sv.style.display=t==='saved'?'flex':'none';
  if(t==='saved') renderSaved();
}

// ─── Profile Screen ───────────────────────────────────────────────
let profilePhotos=[], profilePhotoIdx=0;

function priceHTML(p){
  const count=p.length;
  return [1,2,3,4,5].map(i=>`<span class="${i<=count?'active':'inactive'}">$</span>`).join('');
}

async function openProfile(p){
  window._currentProfilePlaceId = p.id;
  profilePhotos=[]; profilePhotoIdx=0;

  const screen=document.getElementById('profileScreen');
  screen.style.display='flex'; screen.classList.remove('closing');

  document.getElementById('profileName').textContent=p.n;
  document.getElementById('profileCat').textContent=p.c;
  document.getElementById('profilePrice').innerHTML=priceHTML(p.p);
  document.getElementById('profilePhotoFallback').textContent=p.e;
  document.getElementById('profilePhotoImg').style.backgroundImage='';
  document.getElementById('profilePhotoImg').style.opacity='1';

  const igHandle=p.ig.replace('@','');
  document.getElementById('profileIgHandle').textContent=p.ig;
  document.getElementById('profileIgBtn').href=`https://instagram.com/${igHandle}`;

  const addrEsc=p.a.replace(/'/g,"\\'");
  document.getElementById('profileInfoGrid').innerHTML=`
    <div class="info-card" style="cursor:pointer;" onclick="openAddrSheet('${addrEsc}')">
      <div class="info-card-icon">📍</div>
      <div class="info-card-content">
        <div class="info-card-label">Endereço</div>
        <div class="info-card-value">${p.a}</div>
      </div>
      <button class="info-card-action" onclick="event.stopPropagation();openAddrSheet('${addrEsc}')">Ver opções</button>
    </div>
    <div class="info-card">
      <div class="info-card-icon">🏘️</div>
      <div class="info-card-content">
        <div class="info-card-label">Bairro</div>
        <div class="info-card-value">${p.b}</div>
      </div>
    </div>
    <div class="info-card">
      <div class="info-card-icon">🕐</div>
      <div class="info-card-content">
        <div class="info-card-label">Horário</div>
        <div class="info-card-value">${p.h}</div>
      </div>
    </div>`;

  // Comentários
  if (typeof window.renderCommentsSection==='function') {
    window.renderCommentsSection(p.id);
  }

  // Story bars placeholder
  document.getElementById('storyBars').innerHTML='<div class="story-bar"><div class="story-bar-fill"></div></div>';

  fetchAllPhotos(p.pid).then(urls=>{
    if(!urls.length) return;
    profilePhotos=urls; profilePhotoIdx=0;
    updateProfileStoryBars();
    setProfilePhoto(0);
  });

  document.getElementById('storyTapLeft').onclick=()=>storyPrev();
  document.getElementById('storyTapRight').onclick=()=>storyNext();
  document.getElementById('profileClose').onclick=closeProfile;
}

function setProfilePhoto(i){
  if(!profilePhotos.length) return;
  const img=document.getElementById('profilePhotoImg');
  img.style.opacity='0';
  setTimeout(()=>{ img.style.backgroundImage=`url("${profilePhotos[i]}")`; img.style.opacity='1'; },100);
}

function updateProfileStoryBars(){
  const bars=document.getElementById('storyBars');
  const total=Math.max(profilePhotos.length,1);
  bars.innerHTML='';
  for(let i=0;i<total;i++){
    const bar=document.createElement('div'); bar.className='story-bar';
    const fill=document.createElement('div');
    fill.className='story-bar-fill'+(i<profilePhotoIdx?' done':'');
    if(i===profilePhotoIdx) fill.style.width='100%';
    bar.appendChild(fill); bars.appendChild(bar);
  }
}

function storyNext(){
  if(!profilePhotos.length||profilePhotoIdx>=profilePhotos.length-1) return;
  profilePhotoIdx++; setProfilePhoto(profilePhotoIdx); updateProfileStoryBars();
}
function storyPrev(){
  if(!profilePhotos.length||profilePhotoIdx<=0) return;
  profilePhotoIdx--; setProfilePhoto(profilePhotoIdx); updateProfileStoryBars();
}

function closeProfile(){
  const screen=document.getElementById('profileScreen');
  screen.classList.add('closing');
  if(typeof window.unsubscribeComments==='function') window.unsubscribeComments();
  setTimeout(()=>{ screen.style.display='none'; },300);
}

// ─── Address Sheet ─────────────────────────────────────────────────
function openAddrSheet(addr){
  document.getElementById('addrSheetTitle').textContent=addr;
  document.getElementById('addrBtnMaps').onclick=()=>{
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr+', Curitiba, PR')}`,'_blank');
    closeAddrSheet();
  };
  document.getElementById('addrBtnCopy').onclick=()=>{
    navigator.clipboard.writeText(addr+', Curitiba, PR').then(()=>{
      document.getElementById('addrBtnCopy').innerHTML='<span class="addr-sheet-btn-icon">✅</span> Copiado!';
      setTimeout(closeAddrSheet,1000);
    });
  };
  document.getElementById('addrSheetBackdrop').style.display='flex';
}
function closeAddrSheet(e){
  if(e && e.target!==document.getElementById('addrSheetBackdrop')) return;
  document.getElementById('addrSheetBackdrop').style.display='none';
}

init();
</script>
</body>
</html>
